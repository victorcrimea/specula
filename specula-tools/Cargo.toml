[package]
name = "specula-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "terrain-colors"
path = "src/terrain_colors.rs"

[[bin]]
name = "minimap-icons"
path = "src/minimap_icons.rs"

[[bin]]
name = "territory-border"
path = "src/territory_border.rs"

[[bin]]
name = "selection-atlas"
path = "src/selection_atlas.rs"

[[bin]]
name = "session-gui"
path = "src/session_gui.rs"

[[bin]]
name = "bake-translations"
path = "src/bake_translations.rs"

[[bin]]
name = "bake-unit"
path = "src/bake_unit/main.rs"

[[bin]]
name = "bake-assets"
path = "src/bake_assets/main.rs"

[[bin]]
name = "harness"
path = "src/harness/main.rs"

[dependencies]
brotli = "9"
fast_image_resize = "6.1.0"
lewton = "0.10"
meshopt = "0.6"
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }
ogg = "0.9"
opus = "0.4"
png = "0.18"
polib = "0.3.0"
roxmltree = "0.21"
rubato = "5"
serde_json = "1.0.151"
specula-assets = { path = "../specula-assets" }
webp = { version = "0.3.1", default-features = false }
