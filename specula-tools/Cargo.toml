[package]
name = "specula-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "terrain-colors"
path = "src/terrain_colors.rs"

[[bin]]
name = "minimap-icons"
path = "src/minimap_icons.rs"

[[bin]]
name = "territory-border"
path = "src/territory_border.rs"

[[bin]]
name = "bake-unit"
path = "src/bake_unit/main.rs"

[[bin]]
name = "bake-assets"
path = "src/bake_assets/main.rs"

[dependencies]
lewton = "0.10"
meshopt = "0.6"
ogg = "0.9"
opus = "0.4"
png = "0.18"
roxmltree = "0.21"
rubato = "5"
specula-assets = { path = "../specula-assets" }
