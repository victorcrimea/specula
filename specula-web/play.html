<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/i18n.js"></script>
<title data-i18n>New game</title>
<style>
html, body { margin: 0; min-height: 100%; background: #0f1214; color: #e6e9eb;
  font: 14px system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
label { display: inline-flex; align-items: center; gap: 6px; }
select, button, input[type=text] { font: inherit; color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; padding: 4px 8px; }
button { cursor: pointer; }
:disabled { opacity: 0.5; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
#status, #error, #stopping { margin: 0 0 16px; }
#status[hidden], #error[hidden], #stopping[hidden] { display: none; }
#error { color: #e8a0a0; }
a { color: #8fc1e3; }
</style>
</head>
<body>
<main>
<h1 data-i18n>New game</h1>
<p id="stopping" hidden data-i18n>The server is shutting down. No new game can start; games in progress play on to their end.</p>
<p id="status" hidden>
<span data-i18n>A game is in progress.</span>
<a id="watch" href="/" data-i18n>Watch it</a>
<a id="back" href="/" hidden data-i18n>Back to your game</a>
</p>
<form id="setup">
<div class="row">
<label title="3 to 20 letters, digits, dots, hyphens or underscores, with at least one letter." data-i18n-attrs="title"><span data-i18n>Nickname</span> <input id="nickname" name="nickname" type="text" required minlength="3" maxlength="20" pattern="(?=.*[A-Za-z])[A-Za-z0-9._\-]+" autocomplete="nickname" spellcheck="false"></label>
</div>
<p id="error" hidden></p>
<button id="start" type="submit" data-i18n>New game</button>
</form>
</main>
<script>
const T = (text) => window.speculaT(text);

const form = document.getElementById("setup");
const error = document.getElementById("error");
const nickname = document.getElementById("nickname");
// Kept from the last game, and asked for only when there is none (D10).
const NICKNAME_KEY = "specula.nickname";
try { nickname.value = localStorage.getItem(NICKNAME_KEY) ?? ""; } catch {}
if (!nickname.value) nickname.focus();
let setup = null;

const showStatus = () => {
  document.getElementById("stopping").hidden = !setup.stopping;
  document.getElementById("status").hidden = !setup.running;
  const watch = document.getElementById("watch");
  if (setup.latest) watch.href = "/g/" + setup.latest;
  watch.hidden = setup.mine || !setup.latest;
  const back = document.getElementById("back");
  if (setup.match) back.href = "/g/" + setup.match;
  back.hidden = !setup.mine;
  // Someone else's game is not this visitor's to end.
  document.getElementById("start").disabled = (setup.running && !setup.mine) || setup.stopping;
};

// Opens a setup, which the page then goes to (D13).
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.hidden = true;
  const body = new URLSearchParams(new FormData(form));
  const response = await fetch("/new", { method: "POST", body }).catch(() => null);
  if (response?.ok) {
    try { localStorage.setItem(NICKNAME_KEY, nickname.value); } catch {}
    location.href = "/g/" + (await response.text());
    return;
  }
  const reason = response ? await response.text() : "";
  error.textContent = T("Cannot start the game: %(error)s").replace("%(error)s", T(reason));
  error.hidden = false;
});

(async () => {
  setup = await (await fetch("/new")).json();
  showStatus();
})();
</script>
<script type="module">
const glue = "/pkg/specula_web.js?v=GLUE";
const wasm = "/pkg/specula_web_bg.wasm?v=WASM";
const { default: init, play_setup_main } = await import(glue);
await init({ module_or_path: wasm });
play_setup_main();
</script>
</body>
</html>
