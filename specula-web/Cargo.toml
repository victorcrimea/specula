[package]
name = "specula-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# must match the installed wasm-bindgen CLI exactly
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Document",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "Response",
    "WebSocket",
    "Window",
    "console",
]
