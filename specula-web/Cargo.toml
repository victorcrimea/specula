[package]
name = "specula-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# must match the installed wasm-bindgen CLI exactly
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
specula-assets = { path = "../specula-assets" }
brotli-decompressor = "6.0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BinaryType",
    "Blob",
    "Cache",
    "CacheStorage",
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "Document",
    "File",
    "GainNode",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlSelectElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Performance",
    "Request",
    "Response",
    "StereoPannerNode",
    "Storage",
    "StorageManager",
    "WebSocket",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerLocation",
    "WorkerOptions",
    "WheelEvent",
    "WorkerType",
    "WritableStream",
    "console",
]
