<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specula</title>
<style>
html, body { margin: 0; height: 100%; background: #0f1214; }
#view { display: block; width: 100vw; height: 100vh; }
#controls { position: fixed; top: 8px; left: 8px; right: 96px; display: flex;
  flex-wrap: wrap; align-items: center; gap: 6px; font: 13px system-ui, sans-serif; }
#volumes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 2px 8px; color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; }
#volumes[hidden] { display: none; }
#volumes label { display: flex; align-items: center; gap: 4px; }
#volumes input { width: 72px; accent-color: #8fa3b0; }
#playback { position: fixed; left: 8px; right: 8px; bottom: 8px;
  display: flex; align-items: center; gap: 6px;
  font: 13px system-ui, sans-serif; }
#timeline { flex: 1; min-width: 0; accent-color: #8fa3b0; }
#controls button, #controls select, #playback button, #playback select {
  font: inherit; color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; padding: 4px 8px; }
#controls button[aria-pressed="true"], #playback button[aria-pressed="true"] {
  border-color: #8fa3b0; }
#controls select:disabled, #playback :disabled { opacity: 0.5; }
#loading { position: fixed; left: 50%; top: 44px; width: min(240px, calc(100vw - 200px));
  transform: translateX(-50%); padding: 3px 6px; border: 1px solid #3a4248;
  border-radius: 4px; background: rgba(15, 18, 20, 0.85);
  font: 11px system-ui, sans-serif; color: #e6e9eb; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
#loading-track { height: 3px; margin-top: 2px; border-radius: 2px; background: #2a3035;
  overflow: hidden; }
#loading-fill { height: 100%; width: 0; background: #8fa3b0; transition: width 0.2s; }
#view { cursor: grab; touch-action: none; }
#minimap { position: fixed; left: 8px; bottom: 52px;
  width: min(220px, 40vw); height: min(220px, 40vw);
  border: 1px solid #3a4248; border-radius: 4px; background: #0f1214;
  cursor: pointer; touch-action: none; }
#errors { position: fixed; top: 120px; left: 8px; max-width: calc(100vw - 16px);
  box-sizing: border-box; max-height: 40vh;
  overflow: auto; margin: 0; padding: 6px 8px; white-space: pre-wrap;
  font: 12px ui-monospace, monospace; color: #ffb4a8;
  background: rgba(15, 18, 20, 0.9); border: 1px solid #6b3a34;
  border-radius: 4px; user-select: text; -webkit-user-select: text; }
#errors:empty { display: none; }
#hud { position: fixed; top: 44px; right: 8px; display: flex;
  flex-direction: column; align-items: flex-end; gap: 6px;
  max-width: calc(100vw - 32px); }
#fps, #stats { padding: 4px 8px; white-space: pre-wrap; text-align: right;
  font: 600 13px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; }
body:not(.debug) #stats, body:not(.debug) #errors { display: none; }
#clock { position: fixed; top: 8px; right: 8px; padding: 4px 8px;
  font: 600 15px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; }
#match-over { position: fixed; left: 50%; top: 30%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  max-width: calc(100vw - 32px); box-sizing: border-box;
  font: 13px system-ui, sans-serif; color: #e6e9eb;
  background: rgba(15, 18, 20, 0.9); border: 1px solid #3a4248; border-radius: 4px; }
#match-over[hidden], #current[hidden] { display: none; }
#match-over button { font: inherit; color: #e6e9eb; background: rgba(15, 18, 20, 0.85);
  border: 1px solid #3a4248; border-radius: 4px; padding: 4px 8px; }
#match-over :disabled { opacity: 0.5; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="controls">
<button id="diplomacy" type="button" aria-pressed="false">Diplomacy colours</button>
<select id="perspective" aria-label="Perspective">
<option value="0">Observer</option>
</select>
<button id="sound" type="button" aria-pressed="false">Sound off</button>
<button id="warmup" type="button" disabled>Warm up</button>
<div id="volumes" hidden>
<label>Master <input id="volume-master" type="range" min="0" max="1" step="0.05" value="0.5"></label>
<label>Effects <input id="volume-effects" type="range" min="0" max="1" step="0.05" value="0.5"></label>
<label>Music <input id="volume-music" type="range" min="0" max="1" step="0.05" value="0.5"></label>
</div>
</div>
<div id="clock" aria-label="Match time">0:00</div>
<canvas id="minimap" aria-label="Minimap"></canvas>
<div id="hud">
<div id="fps" aria-label="Frames per second">- FPS</div>
<div id="stats" aria-label="Renderer statistics"></div>
</div>
<div id="loading" role="status">
<span id="loading-text">Loading</span>
<div id="loading-track"><div id="loading-fill"></div></div>
</div>
<div id="playback">
<button id="play" type="button" disabled>Pause</button>
<select id="speed" aria-label="Playback speed" disabled></select>
<input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="Timeline" disabled>
<button id="live" type="button" aria-pressed="true" disabled>Live</button>
<button id="current" type="button" hidden disabled>Current match</button>
</div>
<div id="match-over" role="status" hidden>
<span id="match-over-text">Match over</span>
<button id="match-over-current" type="button" disabled>Current match</button>
<button id="match-over-close" type="button" aria-label="Close">x</button>
</div>
<pre id="errors" aria-live="polite"></pre>
<script>
// Phones have no console to read, so errors and the console's lines are
// shown on the page too.
(() => {
  const box = document.getElementById("errors");
  const show = (text) => { box.textContent += text + "\n"; };
  const error = console.error.bind(console);
  const log = console.log.bind(console);
  console.error = (...args) => { error(...args); show(args.join(" ")); };
  console.log = (...args) => { log(...args); show(args.join(" ")); };
  window.addEventListener("error", (event) => show(event.message));
  window.addEventListener("unhandledrejection", (event) => show(String(event.reason)));
})();
</script>
<script>
// Debug info is for whoever works on the page, not for viewers. Phones
// have no keyboard, so a four-finger tap stands in for I.
(() => {
  const toggle = () => document.body.classList.toggle("debug");
  window.addEventListener("keydown", (event) => {
    if (event.code !== "KeyI" || event.repeat
        || event.ctrlKey || event.metaKey || event.altKey) return;
    if (["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) return;
    toggle();
  });
  window.addEventListener("touchstart", (event) => {
    if (event.touches.length === 4) toggle();
  }, { passive: true });
})();
</script>
<script type="module">
const glue = "./pkg/specula_web.js?v=GLUE";
const wasm = "./pkg/specula_web_bg.wasm?v=WASM";
const { default: init, observer_main } = await import(glue);
await init({ module_or_path: wasm });
observer_main(glue, wasm);
</script>
</body>
</html>
